# Render.com 배포 청사진 — 백엔드 API + PostgreSQL + 프론트 정적 사이트
services:
  # 1) 백엔드 API 서버
  - type: web
    name: khnp-edu-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: khnp-edu-db, property: connectionString }
      - key: PGSSL
        value: "true"
      - key: CORS_ORIGIN
        value: "*"

  # 2) 프론트엔드 정적 사이트 (public/index.html 게시)
  - type: web
    name: khnp-edu-web
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public

databases:
  - name: khnp-edu-db
    plan: basic-256mb
    postgresMajorVersion: "16"
